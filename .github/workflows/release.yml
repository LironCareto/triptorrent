name: Testnet release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: triptorrent-linux-x86_64
            extension: ""
          - os: windows-latest
            artifact: triptorrent-windows-x86_64
            extension: .exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --locked --release -p triptorrent-cli -p triptorrent-desktop
      - name: Package Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir package
          cp target/release/triptorrent target/release/triptorrent-desktop package/
          tar -czf ${{ matrix.artifact }}.tar.gz -C package .
          sha256sum ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256
      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory package
          Copy-Item target/release/triptorrent.exe,target/release/triptorrent-desktop.exe package/
          Compress-Archive package/* "${{ matrix.artifact }}.zip"
          $hash=(Get-FileHash "${{ matrix.artifact }}.zip" -Algorithm SHA256).Hash.ToLower()
          "$hash  ${{ matrix.artifact }}.zip" | Set-Content "${{ matrix.artifact }}.zip.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}.*

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: {path: artifacts, merge-multiple: true}
      - run: gh release create "$GITHUB_REF_NAME" artifacts/* --generate-notes --title "TripTorrent $GITHUB_REF_NAME (Testnet v1)"
        env: {GH_TOKEN: "${{ github.token }}"}
